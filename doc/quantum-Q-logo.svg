<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradiente para dar profundidad -->
    <linearGradient id="quantumGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0066ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6600ff;stop-opacity:1" />
    </linearGradient>

    <!-- Gradiente para el entrelazamiento -->
    <linearGradient id="entanglementGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff00ff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#00ffff;stop-opacity:0.8" />
    </linearGradient>

    <!-- Filtro de brillo cuántico -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fondo oscuro para contraste -->
  <rect width="400" height="400" fill="#0a0a0a"/>

  <!-- Ondas cuánticas de fondo (representan superposición) -->
  <path d="M 50 200 Q 100 150, 150 200 T 250 200 T 350 200"
        stroke="url(#quantumGradient)"
        stroke-width="1"
        fill="none"
        opacity="0.2"/>
  <path d="M 50 210 Q 100 160, 150 210 T 250 210 T 350 210"
        stroke="url(#quantumGradient)"
        stroke-width="1"
        fill="none"
        opacity="0.2"/>
  <path d="M 50 220 Q 100 170, 150 220 T 250 220 T 350 220"
        stroke="url(#quantumGradient)"
        stroke-width="1"
        fill="none"
        opacity="0.2"/>

  <!-- Cuerpo principal de la Q -->
  <circle cx="200" cy="180" r="90"
          stroke="url(#quantumGradient)"
          stroke-width="12"
          fill="none"
          filter="url(#glow)"/>

  <!-- Cola de la Q con diseño entrelazado -->
  <path d="M 260 240 L 300 310"
        stroke="url(#quantumGradient)"
        stroke-width="12"
        stroke-linecap="round"
        filter="url(#glow)"/>

  <!-- Líneas de entrelazamiento cuántico (representan qubits entrelazados) -->
  <g opacity="0.8">
    <!-- Línea entrelazada 1 -->
    <path d="M 140 180 Q 170 150, 200 180 Q 230 210, 260 180"
          stroke="url(#entanglementGlow)"
          stroke-width="2"
          fill="none"
          stroke-dasharray="5,5"
          filter="url(#glow)">
      <animate attributeName="stroke-dashoffset"
               from="0" to="10"
               dur="2s"
               repeatCount="indefinite"/>
    </path>

    <!-- Línea entrelazada 2 -->
    <path d="M 140 160 Q 170 130, 200 160 Q 230 190, 260 160"
          stroke="url(#entanglementGlow)"
          stroke-width="2"
          fill="none"
          stroke-dasharray="5,5"
          filter="url(#glow)">
      <animate attributeName="stroke-dashoffset"
               from="10" to="0"
               dur="2s"
               repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Partículas entrelazadas (qubits) -->
  <!-- Qubit 1 -->
  <g>
    <circle cx="120" cy="140" r="8"
            fill="url(#entanglementGlow)"
            filter="url(#glow)">
      <animate attributeName="r"
               values="8;10;8"
               dur="2s"
               repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="140" r="4" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Qubit 2 (entrelazado con qubit 1) -->
  <g>
    <circle cx="280" cy="140" r="8"
            fill="url(#entanglementGlow)"
            filter="url(#glow)">
      <animate attributeName="r"
               values="8;10;8"
               dur="2s"
               repeatCount="indefinite"/>
    </circle>
    <circle cx="280" cy="140" r="4" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Qubit 3 -->
  <g>
    <circle cx="120" cy="220" r="8"
            fill="url(#entanglementGlow)"
            filter="url(#glow)">
      <animate attributeName="r"
               values="10;8;10"
               dur="2s"
               repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="220" r="4" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Qubit 4 (entrelazado con qubit 3) -->
  <g>
    <circle cx="280" cy="220" r="8"
            fill="url(#entanglementGlow)"
            filter="url(#glow)">
      <animate attributeName="r"
               values="10;8;10"
               dur="2s"
               repeatCount="indefinite"/>
    </circle>
    <circle cx="280" cy="220" r="4" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Conexiones de entrelazamiento (Bell pairs) -->
  <line x1="120" y1="140" x2="280" y2="140"
        stroke="#00ffff"
        stroke-width="1"
        opacity="0.3"
        stroke-dasharray="3,3">
    <animate attributeName="opacity"
             values="0.3;0.6;0.3"
             dur="2s"
             repeatCount="indefinite"/>
  </line>
  <line x1="120" y1="220" x2="280" y2="220"
        stroke="#ff00ff"
        stroke-width="1"
        opacity="0.3"
        stroke-dasharray="3,3">
    <animate attributeName="opacity"
             values="0.6;0.3;0.6"
             dur="2s"
             repeatCount="indefinite"/>
  </line>

  <!-- Orbitas cuánticas alrededor de la Q -->
  <ellipse cx="200" cy="180" rx="110" ry="110"
           stroke="url(#quantumGradient)"
           stroke-width="0.5"
           fill="none"
           opacity="0.3">
    <animateTransform attributeName="transform"
                      type="rotate"
                      from="0 200 180"
                      to="360 200 180"
                      dur="20s"
                      repeatCount="indefinite"/>
  </ellipse>

  <!-- Texto inferior: DI Q SOCIETAS -->
  <text x="200" y="360"
        font-family="Arial, sans-serif"
        font-size="24"
        font-weight="bold"
        fill="url(#quantumGradient)"
        text-anchor="middle"
        filter="url(#glow)">
    DI Q SOCIETAS
  </text>

  <!-- Subtexto: Digital • Inteligente • Cuántica -->
  <text x="200" y="380"
        font-family="Arial, sans-serif"
        font-size="10"
        fill="#00d4ff"
        text-anchor="middle"
        opacity="0.7">
    Digital • Inteligente • Cuántica
  </text>
</svg>
